[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "yang-open-guardrails"
version = "0.1.0"
description = "Official YangYang Python SDK"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "YangYang Research" }]
keywords = ["yangyang", "guardrails", "yog", "llm-safety"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.27",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "respx>=0.21"]

[project.urls]
Homepage = "https://github.com/YangYang-Research/yang-python-sdk"
Repository = "https://github.com/YangYang-Research/yang-python-sdk"
Documentation = "https://github.com/YangYang-Research/yang-python-sdk/tree/develop/docs"

[tool.hatch.build.targets.wheel]
packages = ["src/yang_open_guardrails"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
