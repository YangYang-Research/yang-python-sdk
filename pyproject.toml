[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "yang-open-guardrails"
version = "0.1.0"
description = "Yang Open Guardrails Python SDK — apply INPUT/OUTPUT checks via YAIG"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "YangYang Research" }]
keywords = ["yangyang", "guardrails", "yog", "llm-safety"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "respx>=0.21"]

[project.urls]
Homepage = "https://github.com/YangYang-Research/yang-open-guardrails-python-sdk"
Repository = "https://github.com/YangYang-Research/yang-open-guardrails-python-sdk"

[tool.hatch.build.targets.wheel]
packages = ["src/yang_open_guardrails"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
