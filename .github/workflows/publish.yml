name: Publish PyPI

# Publish only after develop → main merge, then tag / GitHub Release (v*).
on:
  push:
    tags:
      - "v*"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require tag/release commit is on main
        run: |
          set -e
          git fetch origin main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "Refusing publish: HEAD is not on origin/main. Merge develop → main, then tag/release."
            exit 1
          fi
          echo "OK: $(git rev-parse --short HEAD) is reachable from origin/main"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" build twine

      - name: Test
        run: pytest -q

      - name: Build
        run: python -m build

      - name: Check
        run: twine check dist/*

      - name: Publish
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_UPLOAD_PACKAGE }}
        run: twine upload dist/*
